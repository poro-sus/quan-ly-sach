# CI/CD: mỗi khi nhánh main có code mới (push hoặc merge Pull Request):
#   1) chạy test
#   2) nếu test đạt -> gọi Deploy Hook của Render để deploy bản mới
#
# Cần tạo 1 secret trên GitHub:  RENDER_DEPLOY_HOOK_URL
# (Repo > Settings > Secrets and variables > Actions > New repository secret)

name: CI/CD - Test và Deploy lên Render

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # cho phép bấm chạy tay trong tab Actions

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

  deploy:
    needs: test
    # Chỉ deploy khi là push lên main (không deploy cho Pull Request)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Gọi Render Deploy Hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Chưa cấu hình secret RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$HOOK"
          echo "Đã yêu cầu Render deploy commit ${GITHUB_SHA}"
