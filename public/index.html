<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý sách</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1f2430; --muted:#6b7280; --line:#e3e6eb; --accent:#2563eb; --danger:#dc2626; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#12151b; --card:#1b1f27; --text:#e8eaf0; --muted:#9aa3b2; --line:#2a303b; --accent:#6aa0ff; --danger:#f87171; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.5rem; margin: 0 0 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
    form { display:grid; gap:10px; grid-template-columns: 1fr 1fr; }
    form .full { grid-column: 1 / -1; }
    input, select, button { font: inherit; padding: 8px 10px; border-radius: 8px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
    button { cursor:pointer; background:var(--accent); color:#fff; border-color:var(--accent); }
    button.ghost { background:transparent; color:var(--text); border-color:var(--line); }
    button.danger { background:transparent; color:var(--danger); border-color:var(--danger); }
    .row { display:flex; gap:8px; align-items:center; justify-content:space-between; padding:10px 0; border-top:1px solid var(--line); }
    .row:first-child { border-top:0; }
    .meta { color:var(--muted); font-size:.9rem; }
    .actions { display:flex; gap:6px; flex-shrink:0; }
    #msg { min-height:1.4em; color:var(--danger); margin:0 0 8px; }
    .empty { color:var(--muted); text-align:center; padding:16px 0; }
    @media (max-width:520px){ form{grid-template-columns:1fr;} .row{flex-direction:column;align-items:flex-start;} }
  </style>
</head>
<body>
<main>
  <h1>Quản lý sách</h1>

  <div class="card">
    <p id="msg" role="alert"></p>
    <form id="form">
      <input type="hidden" id="id">
      <input id="title" placeholder="Tên sách" required maxlength="200">
      <input id="author" placeholder="Tác giả" required maxlength="200">
      <select id="status" class="full">
        <option value="muon-doc">Muốn đọc</option>
        <option value="dang-doc">Đang đọc</option>
        <option value="da-doc">Đã đọc</option>
      </select>
      <button type="submit" id="submit">Thêm sách</button>
      <button type="button" class="ghost" id="cancel" hidden>Hủy sửa</button>
    </form>
  </div>

  <div class="card">
    <input id="search" class="full" placeholder="Tìm theo tên sách hoặc tác giả..." style="width:100%;margin-bottom:8px">
    <div id="list"></div>
  </div>
</main>

<script>
const LABEL = { 'muon-doc': 'Muốn đọc', 'dang-doc': 'Đang đọc', 'da-doc': 'Đã đọc' };
const $ = (id) => document.getElementById(id);
let books = [];

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Có lỗi xảy ra');
  return data;
}

function render() {
  const list = $('list');
  list.textContent = '';
  if (!books.length) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = 'Chưa có sách nào.';
    list.appendChild(e);
    return;
  }
  for (const b of books) {
    const row = document.createElement('div');
    row.className = 'row';

    const info = document.createElement('div');
    const t = document.createElement('strong');
    t.textContent = b.title; // textContent: tránh XSS
    const m = document.createElement('div');
    m.className = 'meta';
    m.textContent = `${b.author} · ${LABEL[b.status] || b.status}`;
    info.append(t, m);

    const actions = document.createElement('div');
    actions.className = 'actions';
    const edit = document.createElement('button');
    edit.className = 'ghost';
    edit.textContent = 'Sửa';
    edit.onclick = () => startEdit(b);
    const del = document.createElement('button');
    del.className = 'danger';
    del.textContent = 'Xóa';
    del.onclick = () => remove(b);
    actions.append(edit, del);

    row.append(info, actions);
    list.appendChild(row);
  }
}

async function load() {
  try {
    books = await api('/api/books?q=' + encodeURIComponent($('search').value.trim()));
    render();
  } catch (e) { $('msg').textContent = e.message; }
}

function startEdit(b) {
  $('id').value = b.id; $('title').value = b.title; $('author').value = b.author; $('status').value = b.status;
  $('submit').textContent = 'Lưu thay đổi'; $('cancel').hidden = false; $('title').focus();
}
function resetForm() {
  $('form').reset(); $('id').value = '';
  $('submit').textContent = 'Thêm sách'; $('cancel').hidden = true;
}
async function remove(b) {
  if (!confirm(`Xóa "${b.title}"?`)) return;
  try { await api('/api/books/' + b.id, { method: 'DELETE' }); await load(); }
  catch (e) { $('msg').textContent = e.message; }
}

$('form').onsubmit = async (ev) => {
  ev.preventDefault();
  $('msg').textContent = '';
  const body = JSON.stringify({ title: $('title').value, author: $('author').value, status: $('status').value });
  const id = $('id').value;
  try {
    await api(id ? '/api/books/' + id : '/api/books', { method: id ? 'PUT' : 'POST', body });
    resetForm(); await load();
  } catch (e) { $('msg').textContent = e.message; }
};
$('cancel').onclick = resetForm;
let timer;
$('search').oninput = () => { clearTimeout(timer); timer = setTimeout(load, 250); };

load();
</script>
</body>
</html>
