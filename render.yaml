# Render Blueprint: tạo Web Service + Postgres miễn phí.
# autoDeploy tắt để việc deploy do GitHub Actions điều khiển (sau khi test đạt).
services:
  - type: web
    name: quan-ly-sach-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quan-ly-sach-db
          property: connectionString

databases:
  - name: quan-ly-sach-db
    plan: free
